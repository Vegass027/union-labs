version: '3.9'

services:
  # ── API (Node.js / Fastify) ─────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        - NODE_ENV=production
    container_name: agency_api
    restart: always
    env_file: .env.prod
    environment:
      NODE_ENV: production
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - root_default
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.agency-api.rule=Host(`api.union-labs.pro`)"
      - "traefik.http.routers.agency-api.entrypoints=websecure"
      - "traefik.http.routers.agency-api.tls.certresolver=mytlschallenge"
      - "traefik.http.services.agency-api.loadbalancer.server.port=3001"

  # ── Web (Next.js) ──────────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        - NODE_ENV=production
        - NEXT_PUBLIC_SUPABASE_URL=https://bonxmyqbrekbpokgozmh.supabase.co
        - NEXT_PUBLIC_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJvbnhteXFicmVrYnBva2dvem1oIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ2ODI2NDgsImV4cCI6MjA5MDI1ODY0OH0.XBThLdL82sf4xMpEaktVYw9K37kQNY0ZTH9Xo2eFzNQ
        - NEXT_PUBLIC_API_URL=https://api.union-labs.pro
        - NEXT_PUBLIC_WEB_URL=https://union-labs.pro
    container_name: agency_web
    restart: always
    env_file: .env.prod
    environment:
      NODE_ENV: production
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_started
    networks:
      - root_default
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.agency-web.rule=Host(`union-labs.pro`)"
      - "traefik.http.routers.agency-web.entrypoints=websecure"
      - "traefik.http.routers.agency-web.tls.certresolver=mytlschallenge"
      - "traefik.http.services.agency-web.loadbalancer.server.port=3000"

networks:
  root_default:
    external: true
